name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/dev-requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt

      - name: Compile Python sources
        run: python -m compileall app

      - name: Lint backend
        run: ruff check .

      - name: Test backend with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

      - name: Check backend coverage threshold
        run: |
          coverage=$(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -n 1 | tr -cd '0-9.')
          percent=$(awk -v c="$coverage" 'BEGIN { printf "%.2f", c * 100 }')
          echo "backend line coverage: ${percent}%"
          awk -v p="$percent" 'BEGIN { if (p + 0 < 70) exit 1 }'

      - name: Boot backend and smoke test health endpoint
        run: |
          HOST=127.0.0.1 PORT=8000 python -m app > /tmp/cluster-backend.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/health >/tmp/health.json && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health >/tmp/health.json

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build
