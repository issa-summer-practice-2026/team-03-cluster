name: Auto labeler

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels by changed files
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
